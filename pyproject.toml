[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cuped-lite"
version = "0.1.0"
description = "CUPED (Controlled Pre-Experiment Data) variance reduction for A/B tests. NumPy/SciPy only, zero heavy dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cuped-lite developers" }]
keywords = ["ab-testing", "cuped", "variance-reduction", "statistics", "experimentation", "hypothesis-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4,<3",
    "scipy>=1.17,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<1",
    "black>=26,<27",
    "mypy>=2.3,<3",
    "build>=1.6,<2",
]

[project.urls]
Homepage = "https://github.com/koraysrn/cuped-lite"
Repository = "https://github.com/koraysrn/cuped-lite"
Documentation = "https://github.com/koraysrn/cuped-lite#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/cuped_lite"]

[tool.hatch.build.targets.sdist]
include = ["src/cuped_lite", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "scipy"
ignore_missing_imports = true
